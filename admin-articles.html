<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebHub Jobs — จัดการบทความ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:#f4f7fb;color:#0f172a}.top{position:sticky;top:0;z-index:10;background:#0f172a;color:white;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top a{color:white;text-decoration:none;border:1px solid #334155;padding:9px 12px;border-radius:10px}.brand{font-weight:800;font-size:20px}.brand em{color:#38bdf8;font-style:normal}.shell{width:min(1180px,calc(100% - 24px));margin:22px auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.55fr);gap:14px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-weight:800;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit}.tools{display:flex;gap:6px;flex-wrap:wrap;border:1px solid #cbd5e1;border-bottom:0;border-radius:10px 10px 0 0;padding:7px;background:#f8fafc}.tools button,.btn{border:0;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer}.tools button{border:1px solid #cbd5e1;background:white}.editor{min-height:380px;border:1px solid #cbd5e1;border-radius:0 0 10px 10px;padding:14px;outline:none;line-height:1.8}.editor:empty:before{content:attr(data-placeholder);color:#94a3b8}.editor img{max-width:100%;height:auto;display:block;margin:14px auto}.cover{aspect-ratio:16/9;border:1px dashed #94a3b8;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#f8fafc;color:#64748b}.cover img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#0284c7;color:white}.success{background:#16a34a;color:white}.muted{background:#e2e8f0}.danger{background:#dc2626;color:white}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eef2f7}.meta,.note{font-size:12px;color:#64748b}.hidden{display:none!important}.status{padding:3px 8px;border-radius:999px;font-weight:800}.published{background:#dcfce7;color:#166534}.draft{background:#e2e8f0}.busy{opacity:.55;pointer-events:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.editor{min-height:320px}.row{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">WebHub <em>Jobs</em> · บทความ</div><div style="display:flex;gap:8px"><a href="admin.html">← Admin</a><a href="articles.html" target="_blank">ดูหน้า Blog</a></div></header><main class="shell"><div class="card" id="gate">กำลังตรวจสอบสิทธิ์ผู้ดูแล...</div><section id="app" class="hidden"><div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h1 style="margin:0;font-size:24px">จัดการบทความ</h1><div class="note">เขียนจากมือถือหรือคอมได้ รูปจะย่อและแปลง WebP อัตโนมัติ</div></div><button class="btn primary" id="newBtn">+ เขียนบทความใหม่</button></div><div id="editorWrap" class="grid hidden"><div class="card"><div class="field"><label>หัวข้อบทความ *</label><input id="title"></div><div class="field"><label>เนื้อหา *</label><div class="tools"><button data-cmd="formatBlock" data-val="h2">H2</button><button data-cmd="formatBlock" data-val="h3">H3</button><button data-cmd="bold">B</button><button data-cmd="insertUnorderedList">• รายการ</button><button id="insertImg">🖼 เพิ่มรูป</button><input id="contentFile" type="file" accept="image/*" hidden></div><div id="editor" class="editor" contenteditable="true" data-placeholder="เริ่มเขียนบทความ..."></div></div></div><div class="card"><h3 style="margin-top:0">ตั้งค่าบทความ</h3><div class="field"><label>หมวดหมู่</label><select id="cat"><option>คู่มือสมัครงาน</option><option>Jobs Update</option><option>HR</option><option>Resume</option><option>เงินเดือน</option><option>สิทธิแรงงาน</option><option>Career</option><option>ตลาดงาน</option></select></div><div class="field"><label>URL Slug</label><input id="slug" placeholder="how-to-write-resume"><div class="note">เว้นว่างได้ ระบบจะสร้างให้อัตโนมัติ</div></div><div class="field"><label>คำโปรย</label><textarea id="excerpt" rows="3"></textarea></div><div class="field"><label>ภาพปก</label><div id="coverPreview" class="cover">ยังไม่มีภาพปก</div><input id="coverFile" type="file" accept="image/*"></div><div class="field"><label>SEO Title</label><input id="seo" maxlength="65"></div><div class="field"><label>Meta Description</label><textarea id="meta" rows="3" maxlength="170"></textarea></div><div class="actions"><button class="btn muted" id="draftBtn">บันทึกฉบับร่าง</button><button class="btn success" id="publishBtn">เผยแพร่</button><button class="btn muted" id="cancelBtn">ยกเลิก</button></div><p id="msg" class="note"></p></div></div><div class="card"><h3 style="margin-top:0">บทความทั้งหมด</h3><div id="list"><div class="note">กำลังโหลด...</div></div></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';import{getStorage,ref,uploadBytes,getDownloadURL,deleteObject}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),$=s=>document.querySelector(s);let rows=[],editing=null,cover={url:'',path:''};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function slugify(v){const s=v.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');if(s)return s;const d=new Date(),p=n=>String(n).padStart(2,'0');return`article-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}function textExcerpt(){return($('#editor').innerText||'').replace(/\s+/g,' ').trim().slice(0,180)}async function compress(file,maxWidth,quality){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no(new Error('แปลงรูปไม่สำเร็จ'))},'image/webp',quality)};img.onerror=()=>no(new Error('อ่านรูปไม่สำเร็จ'));img.src=u})}async function upload(file,type){if(!file?.type.startsWith('image/'))throw new Error('กรุณาเลือกไฟล์รูปภาพ');const blob=await compress(file,type==='cover'?1200:1600,type==='cover'?.84:.82),id=editing||slugify($('#slug').value||$('#title').value||'article'),path=`articles/${id}/${type}-${Date.now()}.webp`,r=ref(storage,path);await uploadBytes(r,blob,{contentType:'image/webp',cacheControl:'public,max-age=31536000'});return{url:await getDownloadURL(r),path}}function busy(v,m=''){$('#editorWrap').classList.toggle('busy',v);$('#msg').textContent=m}function openEditor(a=null){editing=a?.id||null;cover={url:a?.coverUrl||'',path:a?.coverPath||''};$('#editorWrap').classList.remove('hidden');$('#title').value=a?.title||'';$('#cat').value=a?.category||'คู่มือสมัครงาน';$('#slug').value=a?.slug||'';$('#slug').disabled=!!a;$('#excerpt').value=a?.excerpt||'';$('#seo').value=a?.seoTitle||'';$('#meta').value=a?.metaDescription||'';$('#editor').innerHTML=a?.contentHtml||'';$('#coverPreview').innerHTML=cover.url?`<img src="${cover.url}" alt="ภาพปก">`:'ยังไม่มีภาพปก';$('#msg').textContent=a?'กำลังแก้ไขบทความ':'บทความใหม่';window.scrollTo({top:0,behavior:'smooth'})}async function save(status){const title=$('#title').value.trim();if(!title||!$('#editor').innerText.trim()){alert('กรุณาใส่หัวข้อและเนื้อหาบทความ');return}let id=editing||slugify($('#slug').value||title);if(!editing&&(await getDoc(doc(db,'articles',id))).exists())id+=`-${Date.now().toString().slice(-5)}`;busy(true,status==='published'?'กำลังเผยแพร่...':'กำลังบันทึก...');try{const old=editing?rows.find(x=>x.id===editing):null,ex=$('#excerpt').value.trim()||textExcerpt(),data={title,slug:id,category:$('#cat').value,excerpt:ex,contentHtml:$('#editor').innerHTML,coverUrl:cover.url,coverPath:cover.path,seoTitle:$('#seo').value.trim()||title,metaDescription:$('#meta').value.trim()||ex.slice(0,160),status,updatedAt:serverTimestamp(),authorName:auth.currentUser?.displayName||'WebHub'};if(!old)data.createdAt=serverTimestamp();if(status==='published'&&old?.status!=='published')data.publishedAt=serverTimestamp();if(status==='published'&&old?.status==='published')data.publishedAt=old.publishedAt;await setDoc(doc(db,'articles',id),data,{merge:true});editing=id;$('#slug').value=id;$('#slug').disabled=true;$('#msg').textContent=status==='published'?'เผยแพร่เรียบร้อย ✓':'บันทึกฉบับร่างแล้ว ✓';await load()}catch(x){$('#msg').textContent='บันทึกไม่ได้: '+x.message}finally{busy(false)}}async function load(){const s=await getDocs(collection(db,'articles'));rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt?.seconds||b.createdAt?.seconds||0)-(a.updatedAt?.seconds||a.createdAt?.seconds||0));render()}function render(){const box=$('#list');if(!rows.length){box.innerHTML='<div class="note">ยังไม่มีบทความ กด “เขียนบทความใหม่” เพื่อเริ่มต้น</div>';return}box.innerHTML=rows.map(a=>`<div class="row"><div><b>${esc(a.title)}</b><div class="meta">${esc(a.category||'-')} · <span class="status ${a.status==='published'?'published':'draft'}">${a.status==='published'?'เผยแพร่แล้ว':'ฉบับร่าง'}</span></div></div><div class="actions"><button class="btn muted" data-edit="${esc(a.id)}">แก้ไข</button>${a.status==='published'?`<a class="btn primary" target="_blank" style="text-decoration:none" href="article.html?slug=${encodeURIComponent(a.id)}">ดู</a>`:''}<button class="btn danger" data-del="${esc(a.id)}">ลบ</button></div></div>`).join('');box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(rows.find(x=>x.id===b.dataset.edit)));box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const a=rows.find(x=>x.id===b.dataset.del);if(!confirm(`ลบบทความ “${a?.title||''}” ?`))return;await deleteDoc(doc(db,'articles',b.dataset.del));if(a?.coverPath)deleteObject(ref(storage,a.coverPath)).catch(()=>{});await load()})}$('#newBtn').onclick=()=>openEditor();$('#cancelBtn').onclick=()=>$('#editorWrap').classList.add('hidden');$('#title').onblur=()=>{if(!$('#slug').value)$('#slug').value=slugify($('#title').value)};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=e=>{e.preventDefault();document.execCommand(b.dataset.cmd,false,b.dataset.val||null);$('#editor').focus()});$('#insertImg').onclick=e=>{e.preventDefault();$('#contentFile').click()};$('#contentFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy(true,'กำลังอัปโหลดรูปประกอบ...');try{const r=await upload(f,'content');document.execCommand('insertHTML',false,`<img src="${r.url}" data-storage-path="${r.path}" alt="">`)}catch(x){alert(x.message)}finally{busy(false);e.target.value=''}};$('#coverFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy(true,'กำลังอัปโหลดภาพปก...');try{cover=await upload(f,'cover');$('#coverPreview').innerHTML=`<img src="${cover.url}" alt="ภาพปก">`}catch(x){alert(x.message)}finally{busy(false);e.target.value=''}};$('#draftBtn').onclick=()=>save('draft');$('#publishBtn').onclick=()=>save('published');onAuthStateChanged(auth,async u=>{if(!u){location.href='admin.html';return}const p=await getDoc(doc(db,'users',u.uid));if(!p.exists()||p.data().role!=='admin'){location.href='admin.html';return}$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');load().catch(x=>$('#list').innerHTML=`<div class="note">โหลดไม่ได้: ${esc(x.message)}</div>`)});</script></body></html>
