<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075985"><title>บทความความรู้เรื่องงาน | WebHub Jobs</title><meta name="description" content="บทความสมัครงาน Resume สัมภาษณ์ เงินเดือน สิทธิแรงงาน HR และแนวโน้มตลาดงานจาก WebHub Jobs"><link rel="canonical" href="https://webhub.asia/articles.html"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',sans-serif;color:#0f172a;background:#fff}a{color:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e2e8f0}.topin{max-width:1180px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{text-decoration:none;font-weight:800;font-size:21px;color:#075985}.back{text-decoration:none;font-weight:700;color:#475569}.hero{background:linear-gradient(135deg,#effaff,#f8fbff);border-bottom:1px solid #e2e8f0}.heroin{max-width:1180px;margin:auto;padding:48px 20px 34px}.kicker{font-size:12px;font-weight:800;color:#0284c7}.hero h1{font-size:clamp(30px,4vw,48px);margin:7px 0 8px}.hero p{max-width:720px;color:#64748b;line-height:1.8}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.filter{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:8px 13px;font-weight:700;cursor:pointer}.filter.active{background:#075985;color:#fff;border-color:#075985}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 26px}.card{text-decoration:none;display:block}.thumb{aspect-ratio:16/9;background:#e2e8f0;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.fallback{width:100%;height:100%;display:grid;place-items:center;font-size:46px;background:#eff6ff}.cat{color:#f05a37;font-size:14px;font-weight:700;margin-top:13px}.card h2{font-size:21px;line-height:1.45;margin:6px 0 7px}.desc{color:#64748b;line-height:1.7;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{margin-top:10px;font-size:12px;color:#94a3b8}.empty{padding:60px 0;text-align:center;color:#64748b}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.topin,.heroin,.wrap{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr;gap:26px}.hero h1{font-size:32px}.card h2{font-size:20px}}</style></head><body><header class="top"><div class="topin"><a class="brand" href="index.html">WebHub Jobs</a><a class="back" href="index.html">← กลับหน้าหางาน</a></div></header><section class="hero"><div class="heroin"><div class="kicker">CAREER KNOWLEDGE</div><h1>บทความความรู้เรื่องงาน</h1><p>รวมคู่มือสมัครงาน Resume สัมภาษณ์ เงินเดือน สิทธิแรงงาน HR และแนวโน้มตลาดงาน เพื่อช่วยให้ตัดสินใจเรื่องงานได้ง่ายขึ้น</p></div></section><main class="wrap"><div id="filters" class="filters"></div><div id="list" class="grid"><div class="empty">กำลังโหลดบทความ…</div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getFirestore,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),db=getFirestore(app),list=document.querySelector('#list'),filters=document.querySelector('#filters');let rows=[];const STATIC=new Set(['job-interview-preparation-tips']);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=t=>t?.toDate?new Intl.DateTimeFormat('th-TH',{dateStyle:'medium'}).format(t.toDate()):'';const icons={'คู่มือสมัครงาน':'🧭','Jobs Update':'💼','HR':'👥','Resume':'📄','เงินเดือน':'💰','สิทธิแรงงาน':'⚖️','Career':'🚀','ตลาดงาน':'📈'};const href=a=>{const s=a.slug||a.id;return STATIC.has(s)?`articles/${encodeURIComponent(s)}/`:`article.html?slug=${encodeURIComponent(s)}`};function render(cat='ทั้งหมด'){const data=cat==='ทั้งหมด'?rows:rows.filter(x=>x.category===cat);if(!data.length){list.innerHTML='<div class="empty">ยังไม่มีบทความในหมวดนี้</div>';return}list.innerHTML=data.map(a=>`<a class="card" href="${href(a)}"><div class="thumb">${a.coverUrl?`<img loading="lazy" src="${esc(a.coverUrl)}" alt="${esc(a.title)}">`:`<div class="fallback">${icons[a.category]||'📝'}</div>`}</div><div class="cat">${esc(a.category||'บทความ')}</div><h2>${esc(a.title)}</h2><div class="desc">${esc(a.excerpt||'')}</div><div class="meta">${fmt(a.publishedAt||a.updatedAt)}</div></a>`).join('')}function drawFilters(){const cats=['ทั้งหมด',...new Set(rows.map(x=>x.category).filter(Boolean))];filters.innerHTML=cats.map((c,i)=>`<button class="filter ${i===0?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');filters.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filters.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)})}try{const s=await getDocs(query(collection(db,'articles'),where('status','==','published')));rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.publishedAt?.seconds||b.updatedAt?.seconds||0)-(a.publishedAt?.seconds||a.updatedAt?.seconds||0));drawFilters();render()}catch(e){list.innerHTML=`<div class="empty">โหลดบทความไม่ได้: ${esc(e.message)}</div>`}</script></body></html>
