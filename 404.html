<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>กำลังพากลับหน้าแรก | WebHub Jobs</title>
  <script>
    (function(){
      const rawPath = decodeURIComponent(location.pathname || '/');
      const cleanedPath = rawPath.replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').replace(/\s+$/g,'');
      if (cleanedPath === '/index.html' || cleanedPath === '/index.htm' || cleanedPath === '/') {
        location.replace('/' + location.search + location.hash);
        return;
      }
      if (cleanedPath !== rawPath) {
        location.replace(cleanedPath + location.search + location.hash);
        return;
      }
    })();
  </script>
  <style>body{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a}.box{max-width:520px;padding:32px;text-align:center}.box a{display:inline-block;margin-top:16px;padding:11px 18px;border-radius:10px;background:#0f6fb5;color:#fff;text-decoration:none;font-weight:700}</style>
</head>
<body>
  <main class="box">
    <h1>ไม่พบหน้าที่ต้องการ</h1>
    <p>ลิงก์อาจมีอักขระแฝงหรือถูกคัดลอกมาไม่ครบ</p>
    <a href="/">กลับหน้าแรก WebHub Jobs</a>
  </main>
</body>
</html>
