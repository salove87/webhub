<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebHub Jobs — ย้ายข้อมูลประกาศเดิม</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f8fb}.panel{width:min(760px,calc(100% - 28px));margin:50px auto;background:#fff;padding:30px;border:1px solid #dbe5ee;border-radius:20px;box-shadow:0 18px 50px rgba(15,23,42,.1)}label{display:block;margin:13px 0;font-weight:700}input{width:100%;min-height:45px;border:1px solid #dbe5ee;border-radius:9px;padding:0 12px}.log{margin-top:18px;padding:15px;border-radius:10px;background:#f8fafc;white-space:pre-wrap;color:#475569}.warn{color:#92400e;background:#fffbeb;padding:12px;border-radius:10px}.hidden{display:none}</style></head><body><main class="panel"><a class="brand" href="index.html"><span>WH</span><b>WebHub <em>Jobs</em></b></a><h1>ย้ายประกาศงานเดิม</h1><p class="warn">หน้านี้ใช้เฉพาะผู้ดูแลระบบ ระบบจะเพิ่มฟิลด์ใหม่ให้ประกาศเดิม แต่ไม่ลบข้อมูลต้นฉบับ</p><form id="login"><label>อีเมลผู้ดูแล<input id="email" type="email" required></label><label>รหัสผ่าน<input id="password" type="password" required></label><button class="btn primary" type="submit">เข้าสู่ระบบผู้ดูแล</button></form><section id="tools" class="hidden"><p id="identity"></p><button class="btn primary" id="scan">ตรวจสอบประกาศเดิม</button><button class="btn ghost hidden" id="migrate">ย้ายข้อมูลทั้งหมด</button></section><div id="log" class="log">รอเข้าสู่ระบบ…</div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc,writeBatch,serverTimestamp,Timestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),log=document.querySelector('#log');let legacy=[];const out=x=>log.textContent=x;
document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{const c=await signInWithEmailAndPassword(auth,email.value,password.value),u=await getDoc(doc(db,'users',c.user.uid));if(!u.exists()||u.data().role!=='admin')throw new Error('บัญชีนี้ยังไม่ได้กำหนด role เป็น admin');login.classList.add('hidden');tools.classList.remove('hidden');identity.textContent='ผู้ดูแล: '+(c.user.displayName||c.user.email);out('เข้าสู่ระบบสำเร็จ กดตรวจสอบประกาศเดิม')}catch(x){out('ไม่สามารถเข้าสู่ระบบ: '+x.message)}};
scan.onclick=async()=>{try{out('กำลังตรวจสอบ…');const s=await getDocs(collection(db,'jobs'));legacy=s.docs.filter(d=>{const x=d.data();return !x.status||!x.companyName||!x.publishedAt});out(`พบประกาศทั้งหมด ${s.size} รายการ\nต้องปรับรูปแบบ ${legacy.length} รายการ`);if(legacy.length)migrate.classList.remove('hidden')}catch(x){out('ตรวจสอบไม่ได้: '+x.message)}};
const typeMap={'Full-Time':'งานประจำ','Part-Time':'งานพาร์ทไทม์','Contract':'สัญญาจ้าง','Internship':'ฝึกงาน','Remote':'Remote'};const catMap={Accounting:'บัญชี/การเงิน',Marketing:'ขาย/การตลาด',Sales:'ขาย/การตลาด',General:'งานทั่วไป'};const nums=s=>(String(s||'').match(/[\d,]+/g)||[]).map(x=>Number(x.replaceAll(',',''))).filter(Boolean);
migrate.onclick=async()=>{if(!confirm(`ยืนยันย้ายข้อมูล ${legacy.length} รายการ?`))return;try{let done=0;for(let i=0;i<legacy.length;i+=400){const batch=writeBatch(db);legacy.slice(i,i+400).forEach(d=>{const x=d.data(),n=nums(x.salary),patch={companyName:x.companyName||x.company||'ไม่ระบุบริษัท',province:x.province||x.location||'ไม่ระบุ',salaryMin:x.salaryMin||n[0]||0,salaryMax:x.salaryMax||n.at(-1)||0,type:typeMap[x.type]||x.type||'งานประจำ',category:catMap[x.category]||x.category||'งานทั่วไป',status:'published',publishedAt:x.publishedAt||x.createdAt||serverTimestamp(),companyVerified:x.companyVerified??false,viewCount:x.viewCount||0,applicationCount:x.applicationCount||0,legacyMigrated:true,updatedAt:serverTimestamp()};batch.update(d.ref,patch)});await batch.commit();done+=Math.min(400,legacy.length-i);out(`ย้ายข้อมูลแล้ว ${done}/${legacy.length} รายการ`)}migrate.classList.add('hidden');out(`สำเร็จ ย้ายประกาศเดิม ${legacy.length} รายการแล้ว\nกลับไปหน้าเว็บและรีเฟรชเพื่อดูข้อมูล`)}catch(x){out('ย้ายข้อมูลไม่สำเร็จ: '+x.message)}};
</script></body></html>
