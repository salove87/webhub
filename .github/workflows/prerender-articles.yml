name: Prerender Articles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'articles/**'
      - 'articles-static.json'
      - 'sitemap.xml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: prerender-articles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate static articles
        run: |
          node scripts/generate-static-articles.mjs
          node scripts/inject-ga4-static.mjs articles
      - name: Validate generated article output
        run: |
          test -f articles-static.json
          test -f sitemap.xml
          node -e "const fs=require('fs'); const slugs=JSON.parse(fs.readFileSync('articles-static.json','utf8')); for (const slug of slugs) { const p='articles/'+slug+'/index.html'; if (!fs.existsSync(p)) throw new Error('Missing prerender page: '+p); } console.log('Validated '+slugs.length+' prerendered article(s)');"
      - name: Commit generated pages
        run: |
          git add -A articles articles-static.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "WebHub Article Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Auto prerender published articles"
          git push
