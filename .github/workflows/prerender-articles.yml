name: Prerender Articles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'articles/**'
      - 'articles-static.json'
      - 'sitemap.xml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: prerender-articles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate static articles
        run: node scripts/generate-static-articles.mjs
      - name: Commit generated pages
        run: |
          if git diff --quiet -- articles articles-static.json sitemap.xml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "WebHub Article Bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles articles-static.json sitemap.xml
          git commit -m "Auto prerender published articles"
          git push
