<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>WebHub Jobs — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:#f4f7fb;color:#0f172a}.hidden{display:none!important}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.brand em{font-style:normal;color:#38bdf8}.top-actions{display:flex;gap:8px;align-items:center}.top a,.top button{color:#fff;background:transparent;border:1px solid #334155;border-radius:10px;padding:9px 12px;text-decoration:none}.shell{width:min(1280px,calc(100% - 28px));margin:24px auto}.login{max-width:460px;margin:8vh auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0f172a12}.login h1{margin-top:0}.field{display:grid;gap:6px;margin:14px 0}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:#0284c7;color:#fff}.danger{background:#dc2626;color:#fff}.muted{background:#e2e8f0;color:#0f172a}.success{background:#16a34a;color:#fff}.warn{background:#d97706;color:#fff}.wide{width:100%}.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px}.stat b{font-size:28px;display:block}.stat span{color:#64748b}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 14px;font-weight:700}.tab.active{background:#0f172a;color:#fff;border-color:#0f172a}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden}.panel-head{padding:16px;border-bottom:1px solid #e2e8f0;display:flex;gap:10px;align-items:center;justify-content:space-between}.panel-head h2{margin:0;font-size:20px}.panel-head input{max-width:360px;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px}.list{display:grid}.row{padding:15px 16px;border-bottom:1px solid #eef2f7;display:grid;grid-template-columns:minmax(240px,2fr) minmax(130px,1fr) minmax(150px,1fr) auto;gap:12px;align-items:center}.row:last-child{border-bottom:0}.title{font-weight:800}.sub{font-size:13px;color:#64748b;margin-top:3px}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;background:#e2e8f0}.badge.pending{background:#fef3c7;color:#92400e}.badge.published,.badge.verified,.badge.resolved{background:#dcfce7;color:#166534}.badge.rejected,.badge.suspended{background:#fee2e2;color:#991b1b}.badge.open{background:#dbeafe;color:#1d4ed8}.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.actions button{border:0;border-radius:8px;padding:7px 9px;font-weight:700}.empty{padding:30px;text-align:center;color:#64748b}.modal{border:0;border-radius:18px;padding:0;width:min(680px,calc(100% - 24px));box-shadow:0 25px 80px #0004}.modal::backdrop{background:#0f172a99}.modal-in{padding:22px}.modal h2{margin-top:0}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.error{color:#b91c1c;min-height:24px}.small{font-size:12px;color:#64748b}.toolbar{display:flex;gap:8px;align-items:center}.toolbar select{border:1px solid #cbd5e1;border-radius:9px;padding:8px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.actions{justify-content:flex-start}.panel-head{align-items:flex-start;flex-direction:column}.panel-head input{max-width:none}.top{align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.shell{width:min(100% - 18px,1280px)}.stat{padding:13px}.stat b{font-size:23px}.top{padding:12px}.top-actions span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand">WebHub <em>Jobs</em> · Admin</div><div class="top-actions"><span id="adminName"></span><a href="index.html">ดูหน้าบ้าน</a><button id="logoutBtn" class="hidden">ออกจากระบบ</button></div></header>
<main class="shell">
<section id="loginBox" class="login"><h1>เข้าสู่ระบบผู้ดูแล</h1><p>สำหรับผู้ดูแล WebHub Jobs เท่านั้น</p><form id="loginForm"><label class="field">อีเมลผู้ดูแล<input id="email" type="email" autocomplete="username" required></label><label class="field">รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary wide" type="submit">เข้าสู่ระบบ Admin</button><p id="loginError" class="error"></p></form><p class="small">บัญชีต้องมี role = admin ใน Firestore จึงจะเข้าใช้งานได้</p></section>
<section id="dashboard" class="hidden">
<div class="stats"><div class="stat"><b id="sPending">0</b><span>งานรออนุมัติ</span></div><div class="stat"><b id="sPublished">0</b><span>งานเผยแพร่</span></div><div class="stat"><b id="sEmployers">0</b><span>นายจ้าง</span></div><div class="stat"><b id="sCandidates">0</b><span>ผู้หางาน</span></div><div class="stat"><b id="sReports">0</b><span>รายงานรอตรวจ</span></div></div>
<div class="tabs"><button class="tab active" data-tab="jobs">ประกาศงาน</button><button class="tab" data-tab="companies">บริษัท</button><button class="tab" data-tab="users">บัญชีผู้ใช้</button><button class="tab" data-tab="reports">รายงานปัญหา</button><button class="tab" data-tab="applications">ใบสมัคร</button></div>
<section class="panel"><div class="panel-head"><h2 id="panelTitle">จัดการประกาศงาน</h2><div class="toolbar"><select id="statusFilter"><option value="">ทุกสถานะ</option><option value="pending">รอตรวจสอบ</option><option value="published">เผยแพร่แล้ว</option><option value="rejected">ไม่ผ่าน</option><option value="closed">ปิดรับสมัคร</option></select><input id="search" placeholder="ค้นหา..."></div></div><div id="content" class="list"><div class="empty">กำลังโหลดข้อมูล…</div></div></section>
</section>
</main>
<dialog id="reasonDialog" class="modal"><div class="modal-in"><h2>ไม่อนุมัติประกาศงาน</h2><p id="rejectJobName"></p><label class="field">เหตุผล<textarea id="rejectReason" rows="4" placeholder="ระบุเหตุผลให้นายจ้างทราบ" required></textarea></label><div class="modal-actions"><button class="btn muted" id="cancelReject">ยกเลิก</button><button class="btn danger" id="confirmReject">ยืนยันไม่อนุมัติ</button></div></div></dialog>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getFirestore,collection,getDocs,doc,getDoc,updateDoc,serverTimestamp,query,orderBy}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=s=>document.querySelector(s);let currentTab='jobs',cache={jobs:[],companies:[],users:[],reports:[],applications:[]},rejectId=null;
const safe=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=t=>t?.toDate?new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(t.toDate()):'-';
async function adminProfile(u){if(!u)return null;const s=await getDoc(doc(db,'users',u.uid));return s.exists()&&s.data().role==='admin'?s.data():null}
onAuthStateChanged(auth,async u=>{const p=await adminProfile(u).catch(()=>null);if(!p){$('#dashboard').classList.add('hidden');$('#loginBox').classList.remove('hidden');$('#logoutBtn').classList.add('hidden');if(u)await signOut(auth);return}$('#adminName').textContent=p.displayName||u.email;$('#loginBox').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#logoutBtn').classList.remove('hidden');await refreshAll()});
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const c=await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value);const p=await adminProfile(c.user);if(!p){await signOut(auth);throw new Error('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลระบบ')}}catch(x){$('#loginError').textContent=x.message.includes('invalid-credential')?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':x.message}};
$('#logoutBtn').onclick=()=>signOut(auth);
async function read(name){const s=await getDocs(collection(db,name));return s.docs.map(d=>({id:d.id,...d.data()}))}
async function refreshAll(){try{const [jobs,companies,users,reports,applications]=await Promise.all(['jobs','companies','users','reports','applications'].map(read));cache={jobs,companies,users,reports,applications};$('#sPending').textContent=jobs.filter(x=>x.status==='pending').length;$('#sPublished').textContent=jobs.filter(x=>x.status==='published').length;$('#sEmployers').textContent=users.filter(x=>x.role==='employer').length;$('#sCandidates').textContent=users.filter(x=>x.role==='candidate').length;$('#sReports').textContent=reports.filter(x=>x.status==='open').length;render()}catch(x){$('#content').innerHTML=`<div class="empty">โหลดข้อมูลไม่ได้: ${safe(x.message)}</div>`}}
function text(x){return `${x.title||''} ${x.companyName||''} ${x.displayName||''} ${x.email||''} ${x.reason||''} ${x.jobTitle||''}`.toLowerCase()}
function badge(s){return `<span class="badge ${safe(s)}">${safe(({pending:'รอตรวจสอบ',published:'เผยแพร่แล้ว',rejected:'ไม่ผ่าน',closed:'ปิดรับสมัคร',verified:'ยืนยันแล้ว',open:'รอตรวจ',resolved:'จัดการแล้ว',active:'ใช้งาน',suspended:'ระงับ',submitted:'ส่งแล้ว',interview:'นัดสัมภาษณ์',hired:'รับเข้าทำงาน'}[s]||s||'-'))}</span>`}
function render(){const q=$('#search').value.trim().toLowerCase(),sf=$('#statusFilter').value;let list=cache[currentTab].filter(x=>(!q||text(x).includes(q))&&(!sf||x.status===sf));const titles={jobs:'จัดการประกาศงาน',companies:'ตรวจสอบบริษัท',users:'จัดการบัญชีผู้ใช้',reports:'รายงานปัญหา',applications:'ใบสมัครงาน'};$('#panelTitle').textContent=titles[currentTab];$('#statusFilter').style.display=currentTab==='jobs'?'block':'none';if(!list.length){$('#content').innerHTML='<div class="empty">ไม่พบข้อมูล</div>';return}if(currentTab==='jobs')$('#content').innerHTML=list.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(j=>`<div class="row"><div><div class="title">${safe(j.title||'ไม่ระบุตำแหน่ง')}</div><div class="sub">${safe(j.companyName||'-')} · ${safe(j.province||'-')} · ${fmt(j.createdAt)}</div></div><div>${badge(j.status)}</div><div><span class="sub">ผู้เข้าชม ${Number(j.viewCount||0).toLocaleString('th-TH')} ครั้ง</span></div><div class="actions">${j.status==='pending'?`<button class="success" data-approve="${j.id}">อนุมัติ</button><button class="danger" data-reject="${j.id}">ไม่อนุมัติ</button>`:''}${j.status==='published'?`<button class="warn" data-closejob="${j.id}">ปิดประกาศ</button>`:''}${['rejected','closed'].includes(j.status)?`<button class="success" data-approve="${j.id}">เผยแพร่</button>`:''}</div></div>`).join('');
if(currentTab==='companies')$('#content').innerHTML=list.map(c=>`<div class="row"><div><div class="title">${safe(c.name||c.companyName||'บริษัท')}</div><div class="sub">${safe(c.email||c.contactEmail||c.id)}</div></div><div>${c.verified?badge('verified'):'<span class="badge">ยังไม่ยืนยัน</span>'}</div><div><span class="sub">${safe(c.province||c.address||'-')}</span></div><div class="actions"><button class="${c.verified?'warn':'success'}" data-company="${c.id}" data-value="${!c.verified}">${c.verified?'ยกเลิกยืนยัน':'ยืนยันบริษัท'}</button></div></div>`).join('');
if(currentTab==='users')$('#content').innerHTML=list.filter(x=>x.role!=='admin').map(u=>`<div class="row"><div><div class="title">${safe(u.displayName||'-')}</div><div class="sub">${safe(u.email||u.id)}</div></div><div><span class="badge">${u.role==='employer'?'นายจ้าง':'ผู้หางาน'}</span></div><div>${badge(u.status||'active')}</div><div class="actions"><button class="${u.status==='suspended'?'success':'danger'}" data-user="${u.id}" data-value="${u.status!=='suspended'}">${u.status==='suspended'?'เปิดใช้งาน':'ระงับบัญชี'}</button></div></div>`).join('');
if(currentTab==='reports')$('#content').innerHTML=list.map(r=>`<div class="row"><div><div class="title">รายงานประกาศ ${safe(r.jobId||'-')}</div><div class="sub">${safe(r.reason||'ไม่ระบุเหตุผล')} · ${fmt(r.createdAt)}</div></div><div>${badge(r.status)}</div><div><span class="sub">ผู้รายงาน ${safe(r.reporterId||'-')}</span></div><div class="actions">${r.status!=='resolved'?`<button class="success" data-resolve="${r.id}">จัดการแล้ว</button>`:''}</div></div>`).join('');
if(currentTab==='applications')$('#content').innerHTML=list.map(a=>`<div class="row"><div><div class="title">${safe(a.jobTitle||a.jobId)}</div><div class="sub">${safe(a.candidateName||a.candidateId)} → ${safe(a.companyName||a.companyId)}</div></div><div>${badge(a.status)}</div><div><span class="sub">${fmt(a.createdAt)}</span></div><div></div></div>`).join('');bindActions()}
function bindActions(){document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'jobs',b.dataset.approve),{status:'published',publishedAt:serverTimestamp(),reviewedAt:serverTimestamp(),rejectionReason:''});await refreshAll()});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{rejectId=b.dataset.reject;const j=cache.jobs.find(x=>x.id===rejectId);$('#rejectJobName').textContent=j?.title||'';$('#rejectReason').value='';$('#reasonDialog').showModal()});document.querySelectorAll('[data-closejob]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'jobs',b.dataset.closejob),{status:'closed',updatedAt:serverTimestamp()});await refreshAll()});document.querySelectorAll('[data-company]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'companies',b.dataset.company),{verified:b.dataset.value==='true',verifiedAt:b.dataset.value==='true'?serverTimestamp():null});await refreshAll()});document.querySelectorAll('[data-user]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'users',b.dataset.user),{status:b.dataset.value==='true'?'suspended':'active',updatedAt:serverTimestamp()});await refreshAll()});document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'reports',b.dataset.resolve),{status:'resolved',resolvedAt:serverTimestamp()});await refreshAll()})}
$('#cancelReject').onclick=()=>$('#reasonDialog').close();$('#confirmReject').onclick=async()=>{const reason=$('#rejectReason').value.trim();if(!reason)return;await updateDoc(doc(db,'jobs',rejectId),{status:'rejected',rejectionReason:reason,reviewedAt:serverTimestamp(),updatedAt:serverTimestamp()});$('#reasonDialog').close();await refreshAll()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTab=b.dataset.tab;$('#search').value='';$('#statusFilter').value='';render()});$('#search').oninput=render;$('#statusFilter').onchange=render;
</script>
</body></html>
