<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075985"><title>บทความ | WebHub Jobs</title><meta name="description" content="บทความความรู้เรื่องงานจาก WebHub Jobs"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',sans-serif;color:#0f172a;background:#fff}a{color:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e2e8f0}.topin{max-width:980px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{text-decoration:none;font-weight:800;font-size:21px;color:#075985}.back{text-decoration:none;font-weight:700;color:#475569}.wrap{max-width:980px;margin:auto;padding:28px 20px 70px}.crumbs{font-size:13px;color:#64748b;margin-bottom:14px}.cat{color:#f05a37;font-weight:800;font-size:14px}.title{font-size:clamp(30px,5vw,48px);line-height:1.25;margin:8px 0 10px}.meta{color:#94a3b8;font-size:13px}.cover{margin:24px 0 28px;aspect-ratio:16/9;background:#eff6ff;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.content{font-size:18px;line-height:1.9;color:#334155}.content h2{font-size:30px;line-height:1.4;color:#0f172a;margin:34px 0 10px}.content h3{font-size:23px;line-height:1.45;color:#0f172a;margin:28px 0 9px}.content img{max-width:100%;height:auto;display:block;margin:24px auto}.content a{color:#0369a1}.note{margin-top:40px;padding:14px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;color:#64748b;font-size:13px;line-height:1.7}.empty{padding:80px 0;text-align:center;color:#64748b}@media(max-width:600px){.topin,.wrap{padding-left:16px;padding-right:16px}.content{font-size:17px}.content h2{font-size:25px}.content h3{font-size:21px}.title{font-size:32px}}</style></head><body><header class="top"><div class="topin"><a class="brand" href="index.html">WebHub Jobs</a><a class="back" href="articles.html">← บทความทั้งหมด</a></div></header><main class="wrap" id="app"><div class="empty">กำลังโหลดบทความ…</div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),db=getFirestore(app),root=document.querySelector('#app'),slug=new URLSearchParams(location.search).get('slug');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=t=>t?.toDate?new Intl.DateTimeFormat('th-TH',{dateStyle:'long'}).format(t.toDate()):'';if(!slug){root.innerHTML='<div class="empty">ไม่พบบทความ</div>'}else{try{const s=await getDoc(doc(db,'articles',slug));if(!s.exists()||s.data().status!=='published'){root.innerHTML='<div class="empty">ไม่พบบทความหรือบทความยังไม่เผยแพร่</div>'}else{const a=s.data();document.title=`${a.seoTitle||a.title} | WebHub Jobs`;let m=document.querySelector('meta[name="description"]');m.content=a.metaDescription||a.excerpt||'';root.innerHTML=`<div class="crumbs"><a href="articles.html">บทความ</a> › ${esc(a.category||'ความรู้เรื่องงาน')}</div><div class="cat">${esc(a.category||'บทความ')}</div><h1 class="title">${esc(a.title)}</h1><div class="meta">เผยแพร่ ${fmt(a.publishedAt||a.updatedAt)}${a.authorName?` · ${esc(a.authorName)}`:''}</div>${a.coverUrl?`<div class="cover"><img src="${esc(a.coverUrl)}" alt="${esc(a.title)}"></div>`:''}<article class="content">${a.contentHtml||''}</article><div class="note">เนื้อหานี้จัดทำเพื่อให้ข้อมูลทั่วไปเกี่ยวกับการทำงาน ผู้สมัครควรตรวจสอบรายละเอียดจากนายจ้างหรือหน่วยงานที่เกี่ยวข้องก่อนตัดสินใจ</div>`}}catch(e){root.innerHTML=`<div class="empty">โหลดบทความไม่ได้: ${esc(e.message)}</div>`}}</script></body></html>
